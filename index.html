<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogr Landing Page</title>
    <link rel="shortcut icon" href="./images/favicon-32x32 (1).png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <section class="hero">
            <div class="container">
                <header class="header">
                    <a href="#" class="header-logo">
                        <img src="./images/logo.svg" alt="Blogr">
                    </a>
                    <nav class="menu">
                        <ul class="menu-list">
                            <li class="menu-item">
                                <button class="menu-link product-dropdown_button">
                                    <span class="menu-link_text">Product</span>
                                    <div class="menu-link_icon product-icon ibg"></div>
                                </button>
                                <ul class="product-dropdown_menu">
                                    <li class="product-dropdown_item">
                                        <a href="#" class="product-dropdown_link dropdown_link">Contact</a>
                                    </li>
                                    <li class="product-dropdown_item">
                                        <a href="#" class="product-dropdown_link dropdown_link">Newsletter</a>
                                    </li>
                                    <li class="product-dropdown_item">
                                        <a href="#" class="product-dropdown_link dropdown_link">LinkedIn</a>
                                    </li>
                                </ul>
                            </li>
                            <li class="menu-item">
                                <button class="menu-link 
                                company-dropdown_button">
                                    <span class="menu-link_text">Company</span>
                                    <div class="menu-link_icon company-icon ibg"></div>
                                </button>
                                <ul class="company-dropdown_menu">
                                    <li class="product-dropdown_item">
                                        <a href="#" class="product-dropdown_link dropdown_link">Contact</a>
                                    </li>
                                    <li class="product-dropdown_item">
                                        <a href="#" class="product-dropdown_link dropdown_link">Newsletter</a>
                                    </li>
                                    <li class="product-dropdown_item">
                                        <a href="#" class="product-dropdown_link dropdown_link">LinkedIn</a>
                                    </li>
                                </ul>
                            </li>
                            <li class="menu-item">
                                <button class="menu-link 
                                connect-dropdown_button">
                                    <span class="menu-link_text">Connect</span>
                                    <div class="menu-link_icon connect-icon ibg"></div>
                                </button>
                                <ul class="connect-dropdown_menu">
                                    <li class="product-dropdown_item">
                                        <a href="#" class="connect-dropdown_link dropdown_link">Contact</a>
                                    </li>
                                    <li class="product-dropdown_item">
                                        <a href="#" class="product-dropdown_link dropdown_link">Newsletter</a>
                                    </li>
                                    <li class="product-dropdown_item">
                                        <a href="#" class="product-dropdown_link dropdown_link">LinkedIn</a>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                        <div class="menu-buttons">
                            <button class="button-login">Login</button>
                            <button class="button-signup">Sign Up</button>
                        </div>
                    </nav>
                    <div class="burger">
                        <span></span>
                    </div>
                </header>
                <div class="hero-content">
                    <h1 class="content-hero_title">A modern publishing platform</h1>
                    <p class="content-hero_text">Grow your audience and build your online brand</p>
                    <div class="content-hero_buttons">
                        <button class="content-hero_start">Start for Free</button>
                        <button class="content-hero_learn">Learn More</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
